name: CI

on:
  pull_request:
  push:
    # develop is the integration branch; main only receives releases from develop (CONTRIBUTING.md).
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: lms_local_only
          POSTGRES_DB: lms_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lms" --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm content:build --no-diagrams
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://lms:lms_local_only@localhost:5432/lms_test
      - run: pnpm test --coverage
      - run: pnpm audit --prod --audit-level=high

  e2e:
    name: Build, end-to-end and accessibility tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: lms_local_only
          POSTGRES_DB: lms_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lms" --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Cache rendered diagrams
        uses: actions/cache@v4
        with:
          path: .cache
          key: diagrams-${{ hashFiles('pnpm-lock.yaml', 'content/*.md') }}
          restore-keys: diagrams-
      - run: pnpm db:migrate
        env:
          DATABASE_URL: postgres://lms:lms_local_only@localhost:5432/lms_e2e
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  content-diff:
    name: Content diff summary
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Diff content/handbook.md against the base branch
        run: |
          if git diff --quiet "origin/${{ github.base_ref }}" -- content/handbook.md; then
            echo "Content unchanged." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cp content/handbook.md /tmp/new-handbook.md
          git checkout "origin/${{ github.base_ref }}" -- content/handbook.md
          { echo '```'; pnpm --silent content:diff /tmp/new-handbook.md; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          git checkout HEAD -- content/handbook.md

  deploy:
    name: Deploy to Cloudflare (when configured)
    needs: [check, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Skip until Cloudflare is connected
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not set — deploy skipped. See docs/runbook.md." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Cloudflare deploy is added in M6 (OpenNext build + wrangler deploy)." >> "$GITHUB_STEP_SUMMARY"
          fi
